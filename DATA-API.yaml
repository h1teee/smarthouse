version: "1.0"
team_id: "glo"
solution_name: "Мой Дом (SmartHouse)"
base_url: "https://smarthouse-backend-rfil.onrender.com"

checks:
  - id: "check_health"
    description: "Проверка доступности и работоспособности сервиса"
    method: "GET"
    endpoint: "/api/health"
    role: "resident"
    expected_status: [200]
    expected_format: "text/plain"

  - id: "check_map_houses"
    description: "Получение реестра МКД со статусами коммунальных сетей"
    method: "GET"
    endpoint: "/api/map/houses"
    role: "resident"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "array"
      items:
        required: ["houseId", "address", "lat", "lng", "water_status", "electricity_status"]

  - id: "check_user_bills"
    description: "Получение начислений и квитанций ЖКУ жителя"
    method: "GET"
    endpoint: "/api/bills"
    role: "resident"
    query_params:
      user_id: "1"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "array"
      items:
        required: ["id", "user_id", "month", "amount", "is_paid", "account_number"]

  - id: "check_bill_ai_analysis"
    description: "Человекопонятный ИИ-разбор начислений квитанции"
    method: "GET"
    endpoint: "/api/bills/3/ai-analysis"
    role: "resident"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "object"
      required: ["summary"]

  - id: "check_bill_payment"
    description: "Проведение оплаты ЖКУ через СБП с фискализацией"
    method: "POST"
    endpoint: "/api/bills/3/pay"
    role: "resident"
    headers:
      Content-Type: "application/json"
    body:
      payment_method: "sbp"
      account_number: "61-0001-0015"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "object"
      required: ["status", "transaction_id", "receipt_number", "account_number", "amount", "paid_at", "payment_method"]

  - id: "check_privileges"
    description: "Получение предложений партнеров с проверкой отсутствия долгов"
    method: "GET"
    endpoint: "/api/v1/profile/privileges"
    role: "resident"
    query_params:
      user_id: "1"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "array"
      items:
        required: ["id", "partner_name", "badge_text", "offer_text"]

  - id: "check_uk_requests"
    description: "Реестр обращений жителей в диспетчерскую службу УК"
    method: "GET"
    endpoint: "/api/uk/requests"
    role: "uk_moderator"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "array"

  - id: "check_uk_analytics"
    description: "Аналитические показатели УК по домам и заявкам"
    method: "GET"
    endpoint: "/api/uk/analytics"
    role: "uk_moderator"
    expected_status: [200]
    expected_format: "application/json"
    expected_schema:
      type: "object"
      required: ["total_requests", "pending", "approved"]
