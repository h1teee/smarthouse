<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="houseGrad" x1="128" y1="30" x2="128" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C767F5" />
      <stop offset="100%" stop-color="#8E3AD1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A94AD6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Base of the house -->
    <path d="M 64 100 
             L 64 208 
             A 16 16 0 0 0 80 224 
             L 104 224 
             L 104 156 
             A 24 24 0 0 1 152 156 
             L 152 224 
             L 176 224 
             A 16 16 0 0 0 192 208 
             L 192 100 
             Z" 
          fill="url(#houseGrad)" />

    <!-- Chimney -->
    <path d="M 166 46 
             C 166 42 168 40 172 40 
             L 180 40 
             C 184 40 186 42 186 46 
             L 186 96 
             L 166 96 
             Z" 
          fill="url(#houseGrad)" />

    <!-- Roof -->
    <path d="M 36 122 L 128 44 L 220 122" 
          stroke="url(#houseGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
